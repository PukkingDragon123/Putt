<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Putt or Die</title>
<meta name="description" content="A 3D mini-golf roguelike inspired by Buckshot Roulette. Sink the putt or eat lead.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090a0c'/%3E%3Ccircle cx='14' cy='15' r='9' fill='%23d8d4c8'/%3E%3Crect x='21' y='17' width='8' height='4' rx='1' fill='%23c81e1e'/%3E%3C/svg%3E">
<meta property="og:title" content="Putt or Die">
<meta property="og:description" content="A 3D mini-golf roguelike inspired by Buckshot Roulette.">
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* ============================================================
     PUTT OR DIE — RETRO CRT / ARCADE TERMINAL HUD (CSS only)
     No external fonts/images. Monospace + letter-spacing + stepped
     text-shadow = fake pixel-font. box-shadow = fake pixel-art frames.
     ============================================================ */
  :root{
    /* high-contrast amber/green-on-black terminal palette */
    --red:#c81e1e; --red2:#ff3b3b; --amber:#ffb000; --amber2:#ffd24a;
    --green:#39ff5a; --green2:#7fffa0; --cyan:#39d0d8;
    --ink:#05070a; --ink2:#0a0f0d; --bone:#e8e4d4; --dim:#5f7a5a;
    --line:#1c3a1c;              /* terminal frame green */
    --mono:"DejaVu Sans Mono","Courier New",ui-monospace,monospace;
    /* stepped text-shadow that fakes blocky pixel glyph edges */
    --pxs:1px 0 0 currentColor,0 1px 0 currentColor,1px 1px 0 currentColor;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--bone);
    font-family:var(--mono);font-weight:700;user-select:none;-webkit-user-select:none;
    image-rendering:pixelated;text-rendering:geometricPrecision;}
  #c{display:block;position:fixed;inset:0;touch-action:none;image-rendering:pixelated;}

  /* ---- GLOBAL CRT STACK (all pointer-events:none, above canvas) ---- */
  /* #grain: fine scanlines + vignette + screen-curvature radial mask + rolling bar */
  /* The WebGL post pass already does scanlines/vignette/grain/CA on the 3D view,
     so this DOM layer stays light — it mainly gives the HUD a CRT feel and a soft
     edge mask without double-darkening the canvas. */
  #grain{position:fixed;inset:0;pointer-events:none;z-index:50;
    background:
      /* rolling bright bar */
      linear-gradient(0deg,transparent 0%,rgba(120,255,140,.04) 48%,rgba(120,255,140,.07) 50%,rgba(120,255,140,.04) 52%,transparent 100%),
      /* faint aperture-grille vertical RGB stripes */
      repeating-linear-gradient(90deg, rgba(255,0,0,.025) 0 1px, rgba(0,255,0,.025) 1px 2px, rgba(0,80,255,.025) 2px 3px),
      /* gentle corner mask only */
      radial-gradient(135% 135% at 50% 50%, transparent 62%, rgba(0,0,0,.30) 100%);
    background-size:100% 100%,3px 100%,100% 100%;
    mix-blend-mode:normal;
    animation:roll 7s linear infinite;}
  @keyframes roll{0%{background-position:0 -120vh,0 0,0 0,0 0;}100%{background-position:0 120vh,0 0,0 0,0 0;}}
  /* #scan: faint global flicker layer (separate so flash can sit between) */
  #scan{position:fixed;inset:0;pointer-events:none;z-index:51;
    background:rgba(120,255,140,.015);mix-blend-mode:screen;animation:flick .12s steps(2) infinite;}
  @keyframes flick{0%{opacity:.55;}50%{opacity:.85;}100%{opacity:.6;}}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(circle,rgba(200,20,20,.0) 30%,var(--red) 130%);opacity:0;transition:opacity .12s;}

  /* RGB-split fringing helper for any chunky text — applied to logos/labels */
  .rgb{text-shadow:-1px 0 0 rgba(255,0,40,.7),1px 0 0 rgba(0,180,255,.7);}

  /* ---- generic chunky "pixel" panel: hard stepped border via box-shadow ---- */
  .hud{position:fixed;z-index:20;letter-spacing:2px;}
  /* the panel mixin lives on these wrappers */
  #hp,#status,#score,#chamber{padding:6px 10px;background:rgba(4,8,6,.82);
    border:2px solid var(--line);
    box-shadow:0 0 0 2px #000, inset 0 0 0 1px rgba(57,255,90,.18),
               0 3px 0 0 #000, 4px 4px 0 0 rgba(0,0,0,.6);
    text-shadow:0 0 6px rgba(57,255,90,.25),1px 1px 0 #000;}

  #hp{top:12px;left:12px;font-size:22px;letter-spacing:3px;line-height:1;color:var(--red2);}
  #hp .hf{color:var(--red2);text-shadow:0 0 8px var(--red),1px 1px 0 #000;}
  #hp .he{color:#3a1414;text-shadow:none;}
  #status{top:14px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--green2);white-space:nowrap;}
  #status b,#score b{color:var(--amber);font-weight:700;text-shadow:0 0 8px var(--amber),1px 1px 0 #000;}
  #score{top:14px;right:12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.5;}

  /* ---- Dealer dialogue: glitchy amber terminal print ---- */
  #dealer{position:fixed;z-index:22;top:64px;left:50%;transform:translateX(-50%);
    font-size:17px;font-style:normal;letter-spacing:2px;text-transform:uppercase;
    color:var(--amber);white-space:nowrap;opacity:0;
    padding:5px 14px 5px 22px;background:rgba(6,4,0,.85);border:2px solid #5a3a00;
    box-shadow:0 0 0 2px #000,0 0 14px rgba(255,176,0,.3);
    text-shadow:-1px 0 0 rgba(255,0,40,.6),1px 0 0 rgba(0,180,255,.5),0 0 8px rgba(255,176,0,.5);}
  #dealer:before{content:"> ";position:absolute;left:8px;color:var(--green);}
  #dealer.show{animation:bark 3.2s steps(40) forwards, glitch .22s steps(2) infinite;}
  @keyframes bark{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-50%) translateY(-6px);}
    10%{opacity:1;clip-path:inset(0 0 0 0);transform:translateX(-50%) translateY(0);}
    78%{opacity:1;}100%{opacity:0;}}
  @keyframes glitch{0%{transform:translateX(-50%) translate(0,0);}
    40%{transform:translateX(-50%) translate(-1px,0);}60%{transform:translateX(-50%) translate(1px,0);}
    100%{transform:translateX(-50%) translate(0,0);}}

  /* ---- shotgun shell chamber row ---- */
  #chamber{bottom:88px;left:50%;transform:translateX(-50%);text-align:center;}
  .shells{display:flex;gap:5px;justify-content:center;margin-bottom:6px;}
  /* blocky brass-cased shells: hard box-shadow steps, no border-radius */
  .shell{width:14px;height:28px;background:#2a2622;border-radius:0;
    box-shadow:inset 0 -8px 0 #1a1612, inset 0 -10px 0 #000,
               0 0 0 2px #000, 2px 2px 0 rgba(0,0,0,.5);}
  .shell.live{background:linear-gradient(#ff5a5a,#b01414);
    box-shadow:inset 0 -8px 0 #c8a020,inset 0 -10px 0 #000,0 0 0 2px #000,0 0 8px rgba(255,60,60,.6),2px 2px 0 rgba(0,0,0,.5);}
  .shell.blank{background:linear-gradient(#aeb6bc,#4a5056);
    box-shadow:inset 0 -8px 0 #c8a020,inset 0 -10px 0 #000,0 0 0 2px #000,0 0 8px rgba(160,200,220,.5),2px 2px 0 rgba(0,0,0,.5);}
  .shell.spent{opacity:.25;height:18px;align-self:flex-end;box-shadow:0 0 0 2px #000;}
  .cc{font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;}
  .cc .lv{color:var(--red2);text-shadow:0 0 6px var(--red);} .cc .bk{color:var(--green2);text-shadow:0 0 6px var(--green);}

  /* ---- item bag slots (1-4): chunky pixel frames ---- */
  #bag{bottom:14px;left:14px;display:flex;gap:8px;z-index:20;}
  .slot{width:54px;height:54px;border-radius:0;background:rgba(4,8,6,.7);
    border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;
    color:var(--bone);cursor:pointer;padding:0;
    box-shadow:0 0 0 2px #000,inset 0 0 0 1px rgba(57,255,90,.2),3px 3px 0 rgba(0,0,0,.6);}
  .slot .g{font-size:28px;line-height:1;filter:drop-shadow(1px 1px 0 #000);}
  .slot .n{position:absolute;top:1px;left:4px;font-size:11px;color:var(--green);text-shadow:1px 1px 0 #000;}
  .slot.empty{border-style:dashed;border-color:#1a2a1a;opacity:.45;cursor:default;box-shadow:0 0 0 2px #000;}
  .slot:not(.empty):active{transform:translate(2px,2px);border-color:var(--amber);box-shadow:0 0 0 2px #000,0 0 10px rgba(255,176,0,.5);}

  /* ---- oscillating power meter: segmented LED bar ---- */
  #power{position:fixed;z-index:20;bottom:80px;right:18px;width:190px;height:20px;
    background:#050805;border:2px solid var(--line);border-radius:0;overflow:hidden;display:none;
    box-shadow:0 0 0 2px #000,inset 0 0 0 1px rgba(57,255,90,.2);}
  #power.show{display:block;}
  #powerFill{height:100%;width:0;
    background:linear-gradient(90deg,var(--green) 0%,var(--green) 45%,var(--amber) 70%,var(--red2) 100%);
    box-shadow:0 0 10px rgba(57,255,90,.6);}
  /* segment overlay (the dark gaps that make it read as discrete LED cells) */
  #power:after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,transparent 0 10px,#050805 10px 13px);}

  /* ---- PUTT button: arcade cabinet key ---- */
  #putt{position:fixed;z-index:20;bottom:14px;right:18px;width:128px;height:54px;border-radius:0;
    border:2px solid var(--red2);background:linear-gradient(#2a0808,#140404);color:var(--amber2);
    font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:5px;text-transform:uppercase;cursor:pointer;
    text-shadow:0 0 8px var(--amber),1px 1px 0 #000;
    box-shadow:0 0 0 2px #000,0 6px 0 #5a0a0a,0 8px 0 #000,0 0 18px rgba(255,60,60,.4);}
  #putt:active{transform:translateY(5px);box-shadow:0 0 0 2px #000,0 1px 0 #5a0a0a,0 2px 0 #000,0 0 14px rgba(255,60,60,.5);}

  #mute{position:fixed;z-index:20;top:54px;right:14px;width:34px;height:34px;border-radius:0;
    border:2px solid var(--line);background:rgba(4,8,6,.7);color:var(--green2);font-size:15px;cursor:pointer;
    box-shadow:0 0 0 2px #000,2px 2px 0 rgba(0,0,0,.6);}
  #mute:active{transform:translate(2px,2px);}

  /* ---- toasts: terminal status print ---- */
  #toast{position:fixed;z-index:40;bottom:152px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
  .toast{padding:6px 16px;border-radius:0;font-size:15px;letter-spacing:3px;text-transform:uppercase;
    background:rgba(2,5,3,.9);border:2px solid var(--line);
    box-shadow:0 0 0 2px #000,3px 3px 0 rgba(0,0,0,.6);
    animation:tin 1.9s steps(30) forwards;text-shadow:1px 1px 0 #000;}
  .toast.good{color:var(--green);border-color:#1c5a1c;text-shadow:0 0 8px var(--green),1px 1px 0 #000;}
  .toast.bad{color:var(--red2);border-color:#5a1c1c;text-shadow:0 0 8px var(--red),1px 1px 0 #000;}
  .toast.warn{color:var(--amber2);border-color:#5a4400;text-shadow:0 0 8px var(--amber),1px 1px 0 #000;}
  .toast.ok{color:var(--bone);}
  @keyframes tin{0%{opacity:0;transform:translateY(12px);}10%{opacity:1;transform:none;}82%{opacity:1;}100%{opacity:0;transform:translateY(-8px);}}

  /* ---- OVERLAYS: arcade attract-screen ---- */
  .ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px),
      radial-gradient(circle at 50% 40%,rgba(8,20,8,.86),rgba(0,2,1,.97));
    text-align:center;padding:24px;}
  .ov.show{display:flex;}
  /* big blocky logo: stepped multi-shadow extrusion + RGB fringe */
  .logo{font-family:var(--mono);font-size:min(15vw,104px);font-weight:700;letter-spacing:8px;line-height:.95;margin:0;
    color:var(--bone);transform:scaleY(1.1);
    text-shadow:
      -2px 0 0 rgba(255,0,40,.75),2px 0 0 rgba(0,180,255,.65),
      0 3px 0 #0a0,0 6px 0 #060,0 9px 0 #030,0 0 30px rgba(57,255,90,.4);
    animation:logoglitch 4s steps(1) infinite;}
  .logo .or{color:var(--red2);text-shadow:-2px 0 0 rgba(255,0,40,.8),2px 0 0 rgba(0,180,255,.6),0 3px 0 #600,0 6px 0 #300,0 0 26px rgba(255,40,40,.5);}
  @keyframes logoglitch{0%,92%,100%{transform:scaleY(1.1) translate(0,0);}94%{transform:scaleY(1.1) translate(-2px,1px);}96%{transform:scaleY(1.1) translate(2px,-1px);}}
  .tag{color:var(--amber);font-size:15px;letter-spacing:4px;text-transform:uppercase;margin:14px 0 24px;text-shadow:0 0 8px rgba(255,176,0,.4),1px 1px 0 #000;}
  /* blinking "INSERT COIN" style on start/again buttons */
  .btn{padding:14px 30px;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:5px;text-transform:uppercase;
    color:var(--ink);background:var(--green);border:2px solid var(--green2);border-radius:0;cursor:pointer;
    text-shadow:none;box-shadow:0 0 0 2px #000,0 6px 0 #0a6a1a,0 8px 0 #000,0 0 24px rgba(57,255,90,.5);
    animation:blink 1s steps(2) infinite;}
  .btn:active{transform:translateY(5px);box-shadow:0 0 0 2px #000,0 1px 0 #0a6a1a,0 2px 0 #000;}
  @keyframes blink{0%,60%{opacity:1;}61%,100%{opacity:.55;}}
  .how{margin-top:24px;max-width:560px;color:var(--green2);font-size:14px;line-height:1.6;letter-spacing:1px;
    padding:14px 18px;background:rgba(2,8,2,.6);border:2px solid var(--line);box-shadow:0 0 0 2px #000;}
  .how h3{color:var(--amber);letter-spacing:4px;font-size:13px;text-transform:uppercase;margin:0 0 10px;text-shadow:0 0 6px rgba(255,176,0,.4);}
  .how ul{margin:0;padding:0;list-style:none;text-align:left;} .how li{margin:6px 0;padding-left:20px;position:relative;}
  .how li:before{content:"> ";position:absolute;left:0;color:var(--green);}
  .rt{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:4px;color:var(--amber2);
    text-shadow:-1px 0 0 rgba(255,0,40,.6),1px 0 0 rgba(0,180,255,.5),0 0 18px rgba(255,176,0,.4);margin:0;text-transform:uppercase;}
  .rsub{color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin:8px 0 22px;}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:620px;}
  .card{width:172px;min-height:166px;background:rgba(4,10,6,.85);border:2px solid var(--line);border-radius:0;
    padding:18px 14px;cursor:pointer;color:var(--bone);font-family:var(--mono);
    box-shadow:0 0 0 2px #000,4px 4px 0 rgba(0,0,0,.6);transition:transform .1s;}
  .card:hover{border-color:var(--amber);transform:translateY(-4px);box-shadow:0 0 0 2px #000,0 0 18px rgba(255,176,0,.4),4px 8px 0 rgba(0,0,0,.6);}
  .card .cg{font-size:46px;margin-bottom:10px;filter:drop-shadow(2px 2px 0 #000);}
  .card .cn{font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green2);text-shadow:0 0 6px rgba(57,255,90,.3),1px 1px 0 #000;}
  .card .cs{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5;}
  #overStats{color:var(--green2);letter-spacing:2px;text-transform:uppercase;margin:10px 0 24px;font-size:16px;text-shadow:1px 1px 0 #000;}
  #overStats b{color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.5);}
  .err{color:var(--red2);font-size:16px;max-width:520px;line-height:1.6;letter-spacing:1px;text-shadow:1px 1px 0 #000;}

  /* ---- responsive (mobile 390x844) ---- */
  @media (max-width:520px){
    #hp{font-size:18px;}
    #status{font-size:11px;letter-spacing:2px;} #score{font-size:10px;}
    #dealer{font-size:13px;letter-spacing:1px;top:58px;}
    .slot{width:46px;height:46px;} .slot .g{font-size:23px;}
    #putt{width:104px;height:50px;font-size:17px;letter-spacing:3px;}
    #power{width:150px;}
    .logo{letter-spacing:5px;} .how{font-size:13px;} .card{width:152px;}
  }
  /* respect reduced-motion: kill flicker/roll/blink, keep static CRT look */
  @media (prefers-reduced-motion:reduce){
    #grain,#scan,.btn,.logo,#dealer.show{animation:none;}
    #scan{opacity:.6;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grain"></div>
<div id="scan"></div>
<div id="flash"></div>

<div class="hud" id="hp"></div>
<div class="hud" id="status"></div>
<div class="hud" id="score"></div>
<button id="mute" title="Mute (M)">🔊</button>
<div id="dealer"></div>

<div class="hud" id="chamber"></div>
<div class="hud" id="bag"></div>
<div id="power"><div id="powerFill"></div></div>
<button id="putt">Putt</button>
<div id="toast"></div>

<!-- TITLE -->
<div class="ov" id="title">
  <h1 class="logo">PUTT<span class="or"> OR </span>DIE</h1>
  <div class="tag" id="tagline"></div>
  <button class="btn" id="startBtn"></button>
  <div class="how"><h3 id="howTitle"></h3><ul id="howList"></ul></div>
</div>

<!-- REWARD -->
<div class="ov" id="reward">
  <p class="rt" id="rewardTitle"></p>
  <p class="rsub" id="rewardSub"></p>
  <div class="cards" id="rewardCards"></div>
</div>

<!-- GAME OVER -->
<div class="ov" id="over">
  <h1 class="logo" id="overTitle"></h1>
  <div id="overStats"></div>
  <button class="btn" id="againBtn"></button>
</div>

<script type="module">
import { Game } from "./js/game.js";
import { STR } from "./strings.js";

// static strings into the DOM (zero literals in code paths)
document.getElementById("tagline").textContent = STR.tagline;
document.getElementById("startBtn").textContent = STR.start;
document.getElementById("howTitle").textContent = STR.howTitle;
document.getElementById("howList").innerHTML = STR.how.map(s => `<li>${s}</li>`).join("");
document.getElementById("rewardTitle").textContent = STR.rewardTitle;
document.getElementById("rewardSub").textContent = STR.rewardSub;
document.getElementById("overTitle").textContent = STR.over;
document.getElementById("againBtn").textContent = STR.again;

const els = {
  hp: document.getElementById("hp"), status: document.getElementById("status"), score: document.getElementById("score"),
  dealer: document.getElementById("dealer"), chamber: document.getElementById("chamber"), bag: document.getElementById("bag"),
  power: document.getElementById("power"), powerFill: document.getElementById("powerFill"), putt: document.getElementById("putt"),
  toast: document.getElementById("toast"), flash: document.getElementById("flash"), mute: document.getElementById("mute"),
  title: document.getElementById("title"), reward: document.getElementById("reward"), over: document.getElementById("over"),
  rewardCards: document.getElementById("rewardCards"), overStats: document.getElementById("overStats"),
  start: document.getElementById("startBtn"), again: document.getElementById("againBtn"),
};

try {
  const game = new Game(document.getElementById("c"), els);
  game.boot();
  window.__game = game; // dev handle
} catch (err) {
  const t = document.getElementById("title");
  t.classList.add("show");
  t.innerHTML = `<h1 class="logo">PUTT<span class="or"> OR </span>DIE</h1>
    <p class="err">This game needs WebGL, which your browser/device blocked.<br>${(err && err.message) || err}</p>`;
  console.error(err);
}
</script>
</body>
</html>
